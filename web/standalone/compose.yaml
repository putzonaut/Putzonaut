services:
  putzonaut:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - '127.0.0.1:3080:3080'
      - '127.0.0.1:3081:3081'
    volumes:
      - putzonaut-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  putzonaut-data:
